name: CICD

on:
  push:
    branches: ["main", "feature/pipeline-tests", "fix/small-changes"]
  pull_request:
    branches: ["main"]

permissions:
  id-token: write
  pages: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies & test tools
        run: |
          pip install -r requirements.txt
          pip install unittest-xml-reporting

      - name: Generate & convert data
        run: |
          python generate.py
          python csvtojson.py

      - name: Run calculateTests.py with xmlrunner
        run: |
          mkdir -p test-reports
          python -m xmlrunner discover -o test-reports

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: calculateTests.py
          path: test-reports/*.xml
          reporter: java-junit

      - name: Copy to dist
        run: |
          mkdir dist
          cp index.html dist/index.html
          cp data.json dist/data.json
          cp script.js dist/script.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
